# Тестовый мир эксперимента 0.2 — деревня Ольховка.
# Мир не меняется между прогонами: все модели получают одно и то же.
#
# known_by: кто знает факт ("all" — все жители деревни).
# status:   truth — правда; lie — ложь персонажа (told_by — кто её рассказывает);
#           belief — персонаж в это верит, но это не обязательно правда.

[world]
