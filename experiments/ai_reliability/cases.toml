# ===== Невозможные действия (15) =====
# Правильно: ядро не принимает невозможное действие (это проверяет код),
# а NPC в тексте не делает вид, что сделал невозможное.

[[cases]]
id = "impossible-01"
group = "impossible"
npc = "lina"
say = "Дай мне свой лук."
expect = "У Лины нет лука, только меч. Она отказывает или говорит, что лука нет."

