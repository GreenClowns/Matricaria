# 100 тестовых реплик эксперимента 0.2.
#
# Поля:
#   id       — уникальное имя реплики;
#   group    — группа (facts, dead, knowledge, impossible, fabrication, lie, style);
#   npc      — к кому обращается Кира;
#   say      — реплика Киры (или turns — несколько реплик подряд для длинной беседы);
#   expect   — что правильно, человеческими словами (это читает модель-судья);
#   must_any — хотя бы одно из этих сочетаний букв должно быть в ответе (без учёта регистра);
#   must_not — ни одного из этих сочетаний не должно быть в ответе.
# Правила must_any / must_not грубые: это быстрая автоматическая проверка.
# Главная оценка — модель-судья и ручная выборка.

# ===== Знание фактов (20) =====

[[cases]]
id = "facts-01"
group = "facts"
npc = "boris"
say = "Сколько стоит комната?"
expect = "Борис называет цену комнаты: 20 монет за ночь."
