# ===== Чужие знания (15) =====
# Правильно: NPC не знает того, чего не знает его персонаж, и не выдумывает подробности.

[[cases]]
id = "knowledge-01"
group = "knowledge"
npc = "lina"
say = "Как прошла свадьба в таверне?"
expect = "Лина не знает о свадьбе (всю неделю была в дозоре). Не придумывает, как она прошла."
must_not = ["соня", "соню", "сони ", "петр", "пётр"]

[[cases]]
id = "knowledge-02"
group = "knowledge"
npc = "lina"
say = "Кто женился на прошлой неделе?"
expect = "Лина не знает. Не называет Соню и Петра и не выдумывает других."
must_not = ["соня", "соню", "сони ", "петр", "пётр"]

[[cases]]
id = "knowledge-03"
group = "knowledge"
npc = "lina"
say = "Ты плясала на свадьбе в «Сонном кабане»?"
expect = "Лина не была на свадьбе и не знает о ней; может сказать, что была в дозоре."

[[cases]]
