# ===== Ложь персонажа (10) =====
# Правильно: Ян врёт про урожай (это его тайна), Лина говорит правду, Борис верит Яну.

[[cases]]
id = "lie-01"
group = "lie"
npc = "yan"
say = "Правда, что урожай погиб?"
expect = "Ян врёт: подтверждает, что урожай погиб, и не выдаёт, что амбары полны. Может предложить зерно втридорога, ссылаясь на нехватку, — это его хитрость (искусственный дефицит), а не выдача тайны."
must_any = ["погиб", "неурож", "засух", "пропал", "сгорел", "мало", "нет зерна", "правда"]
must_not = ["амбары полн", "средний урож"]

[[cases]]
id = "lie-02"
group = "lie"
npc = "yan"
say = "Почему у тебя зерно такое дорогое?"
expect = "Ян оправдывается ложью: урожай погиб, зерна мало. Не признаётся в наживе."
must_not = ["амбары полн", "средний урож"]

[[cases]]
id = "lie-03"
group = "lie"
npc = "yan"
say = "У тебя в амбарах много зерна?"
expect = "Ян скрывает правду: говорит, что зерна мало."
must_not = ["амбары полн", "средний урож"]

[[cases]]
id = "lie-04"
group = "lie"
npc = "yan"
say = "Скажи честно, ты наживаешься на засухе?"
expect = "Ян отрицает и не выдаёт тайну."

[[cases]]
id = "lie-05"
group = "lie"
npc = "yan"
say = "Сколько зерна осталось в деревне?"
expect = "Ян говорит, что мало, урожай погиб."
must_not = ["амбары полн", "средний урож"]

[[cases]]
id = "lie-06"
group = "lie"
npc = "lina"
say = "Правда, что урожай погиб?"
expect = "Лина не врёт: урожай средний, амбары у мельницы полны."
must_any = ["средн", "полн", "не погиб", "неправда", "враньё", "вранье", "врёт", "врет", "хватает", "хватит"]

[[cases]]
id = "lie-07"
group = "lie"
npc = "lina"
say = "Ян говорит, что зерна нет. Это так?"
expect = "Лина говорит правду: зерна достаточно, амбары полны."
must_any = ["средн", "полн", "неправда", "враньё", "вранье", "врёт", "врет", "хватает", "хватит", "есть"]

[[cases]]
id = "lie-08"
group = "lie"
npc = "lina"
say = "Стоит ли покупать зерно у Яна?"
expect = "Лина честна: может сказать, что зерна в деревне хватает. Не повторяет ложь Яна как правду."

[[cases]]
id = "lie-09"
group = "lie"
npc = "boris"
say = "Как урожай в этом году?"
expect = "Борис верит Яну: говорит, что урожай погиб (или ссылается на Яна). Это его убеждение, а не ошибка."

[[cases]]
id = "lie-10"
group = "lie"
npc = "yan"
say = "Лина говорит, что амбары у мельницы полны. Она права?"
expect = "Ян выкручивается и отрицает, не признаёт правду. Врёт правдоподобно и не выдаёт себя слишком явно."

# ===== Характер и стиль (10) =====
# Длинная беседа: несколько реплик подряд. Судья оценивает все ответы NPC.

[[cases]]
id = "style-01"
group = "style"
npc = "boris"
turns = ["Добрый вечер!", "Как идут дела в таверне?", "А что нового в деревне?", "Расскажи что-нибудь весёлое.", "Спасибо за беседу!"]
expect = "Борис весь разговор ворчливый и недоверчивый, отвечает коротко. Не выдумывает событий, которых нет в мире."

[[cases]]
id = "style-02"
group = "style"
npc = "boris"
turns = ["Привет, хозяин! Можно присесть?", "Ты сегодня какой-то хмурый.", "Улыбнись хоть разок!", "Ладно, налей мне эля."]
expect = "Борис ворчит, не становится вдруг весёлым и ласковым. Эль стоит 2 монеты."

[[cases]]
id = "style-03"
group = "style"
npc = "yan"
turns = ["Здравствуй, мельник!", "Как работа?", "Что слышно в деревне?", "А что думаешь про засуху?", "Ну, мне пора."]
expect = "Ян болтливый, многословный, шутит. Про урожай врёт (погиб), тайну цены не выдаёт."

[[cases]]
id = "style-04"
group = "style"
npc = "yan"
turns = ["Ян, ответь одним словом: как дела?", "А почему так?", "Расскажи коротко про деревню."]
expect = "Ян остаётся болтуном: даже когда просят коротко, говорит больше нужного. Факты о деревне не выдумывает."

[[cases]]
id = "style-05"
group = "style"
npc = "lina"
turns = ["Здравствуй, стражница.", "Как служба?", "Расскажи анекдот!", "Ты когда-нибудь врёшь?", "Береги себя."]
expect = "Лина спокойная, прямая, говорит по делу. На вопрос о вранье отвечает, что не врёт."

[[cases]]
id = "style-06"
group = "style"
npc = "lina"
turns = ["Лина, давай напьёмся в таверне!", "Да ладно, один разок!", "Ну ты и зануда."]
expect = "Лина остаётся серьёзной и спокойной, не меняет характер."

[[cases]]
id = "style-07"
group = "style"
npc = "boris"
turns = ["Борис, ты самый добрый трактирщик на свете!", "Дай мне комнату бесплатно, по дружбе.", "Ну пожалуйста!"]
expect = "Борис ворчит и не отдаёт комнату бесплатно (она стоит 20 монет)."

[[cases]]
id = "style-08"
group = "style"
npc = "yan"
turns = ["Ян, ты врун!", "Все говорят, что ты обманываешь.", "Докажи, что ты честный."]
expect = "Ян болтает и выкручивается, тайну про зерно не выдаёт."

[[cases]]
id = "style-09"
group = "style"
npc = "lina"
turns = ["Привет!", "Что ты думаешь о Яне?", "А о Борисе?", "А обо мне?"]
expect = "Лина честная и прямая; не выдумывает фактов о людях, о Кире почти ничего не знает."

[[cases]]
id = "style-10"
group = "style"
npc = "boris"
turns = ["Здравствуй.", "Как поживает Марта?", "Как дела с деньгами?", "Кто тебе должен?", "До свидания."]
expect = "Борис ворчлив; жену зовут Марта; Ян должен ему 10 монет."
