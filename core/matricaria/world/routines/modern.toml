# Распорядок жителей современного мира (версия 0.4, docs/08-simulation.md).
# Время — "ЧЧ:ММ", сон может переходить через полночь. Деньги — в центах.
# Дни недели: mon, tue, wed, thu, fri, sat, sun.
# Файл можно править без программирования: ядро прочитает его при запуске.

[money]
payday = "fri"          # зарплата за неделю — в конце этой рабочей смены
wages_to = "bank"       # куда приходит зарплата: cash (наличные) или bank (счёт)
takings_to = "bank"     # куда приходит выручка хозяев
card = true             # можно платить со счёта (картой)

[places]
# Где кормят и почём одна еда. Место открыто, только пока там работает хозяин.
food = { cafe = 1200 }
# Куда ходят к людям в свободное время.
social = ["cafe", "park"]

# Для всех, у кого не сказано иначе.
[defaults]
sleep = ["23:00", "07:00"]
days_off = ["sat", "sun"]
eat_out = 0.5           # как часто едят не дома, если есть деньги (0–1)
sociable = 0.3          # как часто идут к людям, даже когда не скучно (0–1)

[professions.barista]
work = ["07:00", "19:00"]
days_off = ["sun"]
takings = [8000, 30000]  # выручка за рабочий день: от и до

[professions.detective]
work = ["09:00", "18:00"]
wage = 22000            # за рабочий день, выплата раз в неделю
eat_out = 0.7

[professions.doctor]
work = ["08:00", "17:00"]
days_off = ["sun"]
wage = 35000

[professions.teacher]
work = ["08:00", "16:00"]
wage = 18000

[professions.shopkeeper]
work = ["09:00", "20:00"]
days_off = ["sun"]
takings = [5000, 25000]

[professions.student]
sleep = ["01:00", "09:00"]
sociable = 0.6
